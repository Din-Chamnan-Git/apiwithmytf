version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
    container_name: spring-boot-api
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

