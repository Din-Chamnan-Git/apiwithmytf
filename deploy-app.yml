---
- name: Deploy Spring Boot API Application
  hosts: webservers
  become: yes

  vars:
    app_name: spring-boot-api
    app_port: 8080
    app_dir: /opt/spring-boot-api
    docker_network: spring-boot-api-network

  tasks:
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: Copy docker-compose.yml from Jenkins workspace
      copy:
        src: "{{ app_source_dir }}/docker-compose.yml"
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Copy Dockerfile from Jenkins workspace
      copy:
        src: "{{ app_source_dir }}/Dockerfile"
        dest: "{{ app_dir }}/Dockerfile"
        mode: '0644'

    - name: Stop running container
      docker_container:
        name: "{{ app_name }}"
        state: stopped
      ignore_errors: yes

    - name: Remove stopped container
      docker_container:
        name: "{{ app_name }}"
        state: absent
      ignore_errors: yes

    - name: Create Docker network if it doesn't exist
      docker_network:
        name: "{{ docker_network }}"
        driver: bridge

    - name: Build and deploy with docker-compose
      shell: |
        cd {{ app_dir }}
        docker-compose down || true
        docker-compose up -d --build
      register: deploy_result

    - name: Wait for application to be ready
      uri:
        url: "http://localhost:{{ app_port }}/hello"
        status_code: 200
      register: result
      until: result.status == 200
      retries: 30
      delay: 5

    - name: Display application status
      debug:
        msg: "✅ Application {{ app_name }} is running and healthy on port {{ app_port }}!"

