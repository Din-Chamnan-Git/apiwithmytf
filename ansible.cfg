[defaults]
# Use paramiko as the SSH library to support password authentication
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
host_key_checking = False

# Use paramiko library for better password authentication support
transport = paramiko

# Retry configuration
retries = 3
retry_files_enabled = True

# Logging
log_path = /tmp/ansible.log

[inventory]
enable_plugins = ini

[privilege_escalation]
become_method = sudo
become_ask_pass = False

